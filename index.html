<meta name="theme-color" content="#000000">
<script>
/* A/B split for portfolio_redesign_v1
   Each new visitor is randomly given version A (original) or B (redesign), 50/50,
   and keeps that version on every later visit from the same browser.
   Add ?v=a or ?v=b to a link to force a version (those visits are tagged "forced"). */
(function () {
  var KEY = "gj-ab-portfolio-v1", v = null, how = "random";
  try {
    var forced = new URLSearchParams(location.search).get("v");
    if (forced === "a" || forced === "b") { v = forced; how = "forced"; }
    else v = localStorage.getItem(KEY);
    if (v !== "a" && v !== "b") v = Math.random() < 0.5 ? "a" : "b";
    if (how === "random") localStorage.setItem(KEY, v);
    if (sessionStorage.getItem("gj-ab-ref") === null) sessionStorage.setItem("gj-ab-ref", document.referrer || "");
    sessionStorage.setItem("gj-ab-assign", how + ":" + v);
  } catch (e) { v = v || (Math.random() < 0.5 ? "a" : "b"); }
  location.replace(v + "/" + location.search + location.hash);
})();
</script>
